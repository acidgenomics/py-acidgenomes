[build-system]
requires = ["uv_build>=0.11,<1"]
build-backend = "uv_build"

[project]
name = "acidgenomes"
version = "0.1.0"
description = "Toolkit for downloading and processing genome annotations."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "Michael Steinbaugh", email = "mike@steinbaugh.com" }]
keywords = ["bioinformatics", "genomics", "annotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "biocframe>=0.7",
    "genomicranges>=0.8",
    "iranges>=0.7",
    "pandas",
    "requests",
]

[project.optional-dependencies]
develop = [
    "bumpver",
    "coverage",
    "interrogate",
    "pyright[nodejs]",
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "uv",
]

[project.urls]
Homepage = "https://github.com/acidgenomics/py-acidgenomes"
Repository = "https://github.com/acidgenomics/py-acidgenomes"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = ["network: marks tests that require network access (deselect with '-m \"not network\"')"]

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72
quote-style = "double"

[tool.ruff.lint]
# List of rules: https://docs.astral.sh/ruff/rules/
select = [
    "ANN", # flake8-annotations
    "B",   # flake8-bugbear
    "C90", # mccabe
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # PyFlakes
    "FIX", # flake8-fixme
    "I",   # isort
    "N",   # pep8-naming
    "NPY", # NumPy-specific rules,
    "PL",  # pylint
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "UP",  # pyupgrade
    "W",   # pycodestyle
]
ignore = [
    "D203",   # one-blank-line-before-class
    "D213",   # multi-line-summary-second-line
    "D401",   # non-imperative-mood
    "ANN401", # dynamically-typed-expression
]

[tool.ruff.lint.isort]
extra-standard-library = ["typing"]
known-first-party = []
order-by-type = true
relative-imports-order = "closest-to-furthest"
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["bytes", "int", "str"]
max-args = 30

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "ANN202", "D", "E402", "F841", "N803", "PLC0415", "PLR2004"]
# Download modules use lazy imports to avoid circular dependencies.
"src/acidgenomes/download/**" = ["B008", "PLC0415"]
# GFF __init__ uses importlib for dynamic provider dispatch.
"src/acidgenomes/gff/__init__.py" = ["PLC0415"]

[tool.coverage.run]
relative_files = true
source = ["src/acidgenomes"]

[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-init-module = true
ignore-property-decorators = false
ignore-setters = false
verbose = 2

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks, except
    "GL01", # do not require docstring formatting that conflicts with ruff
    "GL02", # ...
    "GL03", # ...
    "GL08", # nor require __init__ docstrings (params documented in class docstring)
    "ES01", # nor require an extended summary
    "EX01", # nor examples
    "PR02", # nor require parameter docs for dataclasses (fields are self-documenting)
    "SA01", # nor a see also section
    "SS06", # nor require the summary to fit on one line
]
override_SS05 = ['^Access ', '^Assess ', '^Process ']

[tool.pyright]
pythonVersion = "3.12"
verboseOutput = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = [".venv", "**/__pycache__", "**/.*"]

[tool.ty.terminal]
error-on-warning = true

[tool.bumpver]
commit = true
commit_message = "Bump to {new_version}."
current_version = "v0.1.0"
push = false
tag = false
tag_message = "{new_version}"
tag_scope = "default"
version_pattern = "vMAJOR.MINOR.PATCH"

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{pep440_version}"']
